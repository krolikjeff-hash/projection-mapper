<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projection player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; left: 12px; bottom: 10px; font: 14px system-ui, sans-serif; color: #888; }
  #msg button { font: inherit; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<script type="module">
  import { Engine } from './js/engine.js';
  import { watchShow, watchNow, ensureSignedIn, startCompileTester, startDriver, onUser, isHostUser, canDrive, showId } from './js/cloud.js';
  const msg = document.getElementById('msg');
  let engine;
  try {
    // Tuning for slow GPUs (Pi 5): ?fps=30 (steady cap), ?res=640 (animation texture size), ?aa=0 (no MSAA).
    const q = new URLSearchParams(location.search);
    engine = new Engine(document.getElementById('c'), {
      contentLong: Math.min(2048, Math.max(256, +q.get('res') || 1024)),
      antialias: q.get('aa') !== '0',
      fps: +q.get('fps') || 0,
    });
    window.engine = engine;   // tools/pi.py reads engine.stats
  } catch (e) {
    msg.textContent = 'Player error: ' + e.message;
    throw e;
  }
  engine.start();

  // Live show state and "now playing" from Firestore; it reconnects by itself and the show keeps running meanwhile.
  let state = null, now = null;
  const apply = () => state && engine.setState({ ...state, partyNow: now && now.itemId ? now : null });
  watchShow((s) => { state = s; apply(); });
  watchNow((n) => { now = n; apply(); });

  // The host (Google) or an allowed player login (PLAYER_UIDS in js/cloud.js) runs the party rotation; no Google
  // sign-in is needed on a projector device. Anyone can compile-test guests' shaders.
  let stopDriver = null, user = null, hideTimer = 0;
  // Player ID and rotation status (and the cursor) for 20 s after load and whenever the mouse moves.
  const info = () => {
    clearTimeout(hideTimer);
    if (!user) return;
    document.body.style.cursor = 'default';
    msg.textContent = `Show "${showId}" · ${isHostUser(user) ? user.email : 'player ' + user.uid}` +
      ` · party rotation ${canDrive(user) ? 'ON (this player runs it)' : 'off here (add this player ID to PLAYER_UIDS)'}`;
    hideTimer = setTimeout(() => { msg.textContent = ''; document.body.style.cursor = ''; }, 20000);
  };
  onUser(async (u) => {
    if (!u) { await ensureSignedIn(); return; }
    user = u;
    window.playerStatus = { user: u.email || 'anonymous', uid: u.uid, host: isHostUser(u), driver: canDrive(u) };   // tools/pi.py status
    if (canDrive(u) && !stopDriver) stopDriver = startDriver(() => state);
    info();
  });
  addEventListener('mousemove', info);
  startCompileTester(engine);

  addEventListener('dblclick', () => document.documentElement.requestFullscreen?.().catch(() => {}));
  const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
  wake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
</script>
</body>
</html>
